// KSP Tethers: give every EVA kerbal a tether reel.
// Matches the stock suits, the Breaking Ground (Future) suits, the Vintage suits and any modded
// kerbal part that uses the stock KerbalEVA module.

@PART[*]:HAS[@MODULE[KerbalEVA],!MODULE[ModuleKerbalTether]]:FOR[KSPTethers]
{
	MODULE
	{
		name = ModuleKerbalTether
	}
}
