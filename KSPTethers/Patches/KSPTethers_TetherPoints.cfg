// KSP Tethers: tether points.
//
// A tether point is somewhere a kerbal can clip a tether on with one right-click, and - more usefully - a
// place two of which can be rigged together in the editor so the craft launches with a cable already strung
// between them at whatever slack you set.
//
// The parts below get one because they are the places a crew would actually tie off to. To add one to any
// other part:
//
//   @PART[myPart]:NEEDS[KSPTethers]:FOR[MyMod] { MODULE { name = ModuleTetherPort } }
//
// and optionally point it at the right spot on the model with socketTransform = someTransform,
// socketNode = top, or socketOffset = 0, 0.3, 0. Without any of those the cable is clipped to the nearest
// point on the part's hull, which is usually what you want.
//
// To stop a patch below from applying, delete the module again at :FINAL, e.g.
//   @PART[*]:HAS[@MODULE[ModuleTetherPort]]:FINAL { !MODULE[ModuleTetherPort] {} }

// ---- KAS winches, ports and pylons -----------------------------------------------------------------
// KAS parts know where their own cable leaves from, and the tether is clipped to that same socket.
@PART[*]:HAS[@MODULE[KASLinkWinch],!MODULE[ModuleTetherPort]]:NEEDS[KAS]:FOR[KSPTethers]
{
	MODULE
	{
		name = ModuleTetherPort
	}
}

@PART[*]:HAS[@MODULE[KASLinkTargetBase],!MODULE[ModuleTetherPort]]:NEEDS[KAS]:FOR[KSPTethers]
{
	MODULE
	{
		name = ModuleTetherPort
	}
}

@PART[*]:HAS[@MODULE[KASLinkSourceInteractive],!MODULE[ModuleTetherPort]]:NEEDS[KAS]:FOR[KSPTethers]
{
	MODULE
	{
		name = ModuleTetherPort
	}
}

@PART[*]:HAS[@MODULE[KASLinkResourceConnector],!MODULE[ModuleTetherPort]]:NEEDS[KAS]:FOR[KSPTethers]
{
	MODULE
	{
		name = ModuleTetherPort
	}
}

// ---- Docking ports and the claw --------------------------------------------------------------------
@PART[*]:HAS[@MODULE[ModuleDockingNode],!MODULE[ModuleTetherPort]]:FOR[KSPTethers]
{
	MODULE
	{
		name = ModuleTetherPort
	}
}

@PART[*]:HAS[@MODULE[ModuleGrappleNode],!MODULE[ModuleTetherPort]]:FOR[KSPTethers]
{
	MODULE
	{
		name = ModuleTetherPort
	}
}

// ---- Ladders and handrails -------------------------------------------------------------------------
@PART[*]:HAS[@MODULE[RetractableLadder],!MODULE[ModuleTetherPort]]:FOR[KSPTethers]
{
	MODULE
	{
		name = ModuleTetherPort
	}
}

// ---- Crewed parts ----------------------------------------------------------------------------------
// The hull beside a hatch is where a tether gets clipped most of the time anyway.
@PART[*]:HAS[#CrewCapacity[>0],!MODULE[ModuleTetherPort],!MODULE[KerbalEVA]]:FOR[KSPTethers]
{
	MODULE
	{
		name = ModuleTetherPort
	}
}
