	// ==== Lifeline resources ===================================================================
	// flow = supply: the vessel tops up the kerbal's suit; flow = waste: the suit empties into the vessel.
	// Only resources actually stored on the EVA kerbal are moved, so entries for mods you don't have do
	// nothing. source = the vessel resource a supply is drawn from (defaults to the same resource);
	// enabled = the default before the player changes it in the app.

