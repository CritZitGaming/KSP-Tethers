// KSP Tethers - global tuning.
//
// Most options are in the in-game toolbar app (cable styles, lifeline resources, keys) and in the
// Difficulty Settings under "KSP Tethers" (auto-tether, lengths, reach, reel speed, physics). The values
// below set defaults and tune the simulation. Change them here or with a ModuleManager patch, e.g.
//   @KSP_TETHERS:FINAL { @CABLE_STYLE[umbilical] { @color = 1, 0.55, 0.1, 1 } }

KSP_TETHERS
{
	// ---- Mesh detail --------------------------------------------------------------------------
	radialSides = 10                // tube resolution around its circumference
	smoothingSubdivisions = 3       // spline samples between simulation nodes
	castShadows = true
	lodNearDistance = 25            // full detail within this camera distance (m)
	lodFarDistance = 80             // lowest detail beyond this (m)

	// ---- Rope simulation ----------------------------------------------------------------------
	segmentLength = 0.22            // metres between simulation nodes
	maxNodes = 120                  // longer ropes use longer segments
	solverIterations = 12
	substepRate = 90                // Hz
	damping = 0.12                  // velocity lost per second in vacuum (low = floaty)
	endStiffness = 0.45             // how firmly the rope leaves its fittings
	idleFlow = 0.03                 // m/s^2 of gentle drifting so slack rope never looks frozen
	airDrag = 4                     // per second, per kg/m^3 of air density
	collisions = true               // rope collides with parts, kerbals and terrain
	selfCollision = true            // the rope can't pass through itself
	wrapAroundHulls = true          // a rope draped round the ship pulls from where it touches the hull
	friction = 0.45                 // Coulomb friction of rope on surfaces
	slackFactor = 0.35              // EVA tethers pay out to keep rope >= distance * (1 + slackFactor) + slackBase
	slackBase = 0.6
	payoutSpeed = 4                 // m/s
	cullDistance = 1200             // tethers further than this from the camera are not simulated

	// ---- Physical link ------------------------------------------------------------------------
	// Springs are tuned by natural frequency of the masses on each end, so a kerbal on a line and
	// a tug towing a station both behave sensibly.
	springFrequency = 2             // Hz, kerbal tethers
	springDampingRatio = 0.6
	cableSpringFrequency = 1        // Hz, cables between parts
	cableDampingRatio = 0.8
	maxSpring = 5000                // kN/m cap
	breakForce = 0                  // kN a kerbal tether holds before snapping; 0 = unbreakable
	cableBreakForce = 0             // kN for cables between parts; 0 = unbreakable
	minLength = 0.5                 // metres
	cableEndPickupRadius = 0.6      // metres: how close to a cable end a kerbal must click to pick it up

	// ---- Kerbal attach point (backpack) -------------------------------------------------------
	kerbalBone = bn_jetpack01
	kerbalOffset = 0, 0.049, -0.09

	// ---- Default keys (Unity KeyCode names; players can rebind them in the toolbar app) --------
	toggleKey = Y                   // clip / tap to clip the free end elsewhere / hold to release
	reelInKey = Minus
	reelOutKey = Equals
	releaseHoldTime = 0.8           // seconds to hold toggleKey to release

	// ---- Lifeline -----------------------------------------------------------------------------
	resourceTickInterval = 0.25     // seconds between resource exchanges

	// ---- Sounds -------------------------------------------------------------------------------
	clipSound = Squad/Sounds/sound_click_latch
	releaseSound = Squad/Sounds/ksp1_strunts_disconnect_v3_pitched2
	reelSound = Squad/Sounds/sound_servomotor
	soundVolume = 0.8

	// ==== Cable styles ==========================================================================
	// pattern: ribbed (corrugated hose), braided (sleeve), woven (fabric webbing), twisted (wire rope), smooth
	// tilesPerMeter: pattern repeats along the cable; radius in metres; bendStiffness 0..1 springs the
	// cable back straight; minBendRadius is the tightest curve it will take. Optional:
	// texture = path/to/albedo and normalMap = path/to/normal (GameData-relative, no extension).

	CABLE_STYLE
	{
		name = umbilical
		title = White Umbilical
		pattern = ribbed
		color = 0.94, 0.94, 0.92, 1
		specular = 0.28, 0.28, 0.28, 1
		shininess = 0.12
		fittingColor = 0.55, 0.57, 0.60, 1
		radius = 0.022
		tilesPerMeter = 7
		bump = 1.4
